# Publishes netflix-oca-locator to PyPI when a GitHub release is published, and to
# PyPI or TestPyPI on demand (Actions → Publish → Run workflow, with the tag to build).
#
# Uploads use PyPI Trusted Publishing (OpenID Connect). The publish job requests
# id-token: write and passes no username or password, so no API token is stored.
# Each index needs a trusted publisher for owner `estcarisimo`, repository
# `Netflix-OCA-Servers-Locator`, workflow `publish.yml`, and the environment of
# the job that uploads to it (`pypi` or `testpypi`). A required reviewer on the
# `pypi` environment gates every real upload.
#
# The build checks out the release tag and stops unless the version in
# pyproject.toml and in CITATION.cff equals the tag without its leading `v`.
# PyPI uploads cannot be replaced; a mistake means a new version number.
#
# Nothing here runs on push or pull_request. Configuring the publisher is a
# manual step on PyPI; until that exists, the upload fails and the index is
# unchanged.
#
# https://docs.pypi.org/trusted-publishers/

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (e.g. v2.1.0)"
        required: true
        type: string
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Check the version against the tag
        run: |
          # dist/netflix_oca_locator-<version>-py3-none-any.whl
          git rev-parse HEAD
          wheel_version="$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3-.*/\1/')"
          tag_version="${TAG#v}"
          cite_version="$(awk '/^version:/{gsub(/"/, "", $2); print $2; exit}' CITATION.cff)"
          echo "wheel: ${wheel_version}, tag: ${tag_version}, citation: ${cite_version}"
          if [ "$wheel_version" != "$tag_version" ]; then
            echo "::error::version in pyproject.toml (${wheel_version}) does not match the tag (${tag_version})"
            exit 1
          fi
          if [ "$cite_version" != "$tag_version" ]; then
            echo "::error::CITATION.cff version (${cite_version}) does not match the tag (${tag_version})"
            exit 1
          fi

      - name: Install the wheel in a clean environment and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/netflix-oca-locator version
          /tmp/smoke/bin/netflix-oca-locator info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/netflix-oca-locator
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/netflix-oca-locator
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      # v1.14.3 includes the fix for GHSA-5xjx-3w67-w9x9.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  attach:
    # Runs after the upload, so a failure here means the version IS on PyPI and only
    # the release assets are missing; re-running this job alone is safe.
    name: Attach the distributions to the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Upload the sdist and wheel as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
