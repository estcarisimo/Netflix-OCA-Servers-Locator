name: Docker

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: netflix-oca-locator

jobs:
  # Single-platform build, loaded into the local daemon so the image can
  # actually be run. A multi-platform build cannot be `load`ed, which is why
  # the arm64 build lives in its own job below.
  docker-build:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ env.IMAGE_NAME }}:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test the image
      run: |
        docker run --rm ${{ env.IMAGE_NAME }}:ci version
        docker run --rm ${{ env.IMAGE_NAME }}:ci info
        docker run --rm ${{ env.IMAGE_NAME }}:ci --help

  # Proves the image still builds for arm64. Nothing is executed here: a
  # foreign-architecture image cannot be run on an amd64 runner.
  docker-multiarch:
    name: Build multi-arch (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build for both platforms
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docker-security:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image for security scan
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ env.IMAGE_NAME }}:security-scan
        cache-from: type=gha

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE_NAME }}:security-scan
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
