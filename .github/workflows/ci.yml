name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

# A new push to the same branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Format check with ruff
      run: uv run ruff format --check .

    # Non-blocking: the codebase currently has ~33 pre-existing mypy errors,
    # some of which need behavioural review rather than a mechanical fix.
    # Contributions that reduce this are welcome; see CONTRIBUTING.md.
    - name: Type check with mypy (advisory)
      run: uv run mypy src/
      continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y whois

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest --cov=netflix_oca_locator --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  security:
    name: Security scan (advisory)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    # Advisory only: findings are reported as an artifact, not enforced as a gate.
    # Dependency vulnerabilities are handled by Dependabot (.github/dependabot.yml).
    - name: Run bandit
      run: uv run bandit -r src/ -f json -o bandit-report.json || true

    - name: Show bandit findings in the log
      run: uv run bandit -r src/ || true

    - name: Upload security report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
        python-version: "3.12"
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Install the built wheel and smoke test the CLI
      run: |
        uv venv /tmp/smoke
        VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
        /tmp/smoke/bin/netflix-oca-locator --help
        /tmp/smoke/bin/netflix-oca-locator version

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y whois

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"
        python-version: "3.12"
        enable-cache: true

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Install and exercise the CLI
      run: |
        uv venv /tmp/integration
        VIRTUAL_ENV=/tmp/integration uv pip install dist/*.whl
        # Commands that do not make outbound measurement calls.
        /tmp/integration/bin/netflix-oca-locator info
        /tmp/integration/bin/netflix-oca-locator version
        /tmp/integration/bin/netflix-oca-locator --help
